[project]
name = "sps-genai"
version = "0.1.0"
description = "Applied GenAI: FastAPI with bigram text generation and spaCy word embeddings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]",
    "spacy>=3.8,<3.9",
    "en-core-web-lg",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
